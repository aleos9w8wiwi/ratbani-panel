<style>
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#17102B;color:#F5F3FF}
main{max-width:720px;margin:0 auto;padding:24px 16px}
h1{color:#FFFFFF}h2{margin-top:32px}
.card{background:#251743;border:1px solid #3B2A63;border-radius:12px;padding:16px;margin:12px 0}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{padding:2px 8px;border-radius:20px;background:#333;font-size:13px}
.badge.pending{background:#7a5b00}.badge.approved,.badge.active{background:#1e6b34}.badge.rejected,.badge.revoked{background:#7a1f1f}.badge.expired{background:#7a1f1f}
.badge.mensual{background:#6D28D9}.badge.unico{background:#6b4d1e}
.badge.plan{background:#6D28D9}
.countdown{font-weight:700;color:#F0ABFC}
.brand{text-align:center;margin:8px 0 4px}
.brand img{width:128px;height:128px;border-radius:28px}
.brand h1{margin:8px 0 0;font-size:34px}
.brand p{color:#C4B5FD;margin:4px 0 0}
small{color:#A78BFA}

<div class="card"><h2>Administrador</h2>
<input id="admin-key" type="password" placeholder="Clave de administrador (ADMIN_KEY)">
<button id="admin-btn">Ver solicitudes</button>
<div id="admin-list"></div></div>
</main>
<script>
async function api(path, opts={}){
  const r = await fetch(path, {headers:{'Content-Type':'application/json','x-acceso-admin':document.getElementById('admin-key').value||''}, ...opts});
  const d = await r.json(); if(!r.ok) throw new Error(d.message||('Error '+r.status)); return d;
}
const PLAN_LABEL = {'7d':'7 DÍAS','15d':'15 DÍAS','20d':'20 DÍAS','mensual':'1 MES','2m':'2 MESES','unico':'ÚNICO'};
function fmtRemaining(lease){
  if(!lease) return 'Sin vencimiento';
  const ms = Date.parse(lease) - Date.now();
  if(ms <= 0) return 'Vencido';
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), ss = s%60;
  return d > 0 ? `⏳ ${d}d ${h}h ${m}m` : `⏳ ${h}h ${m}m ${ss}s`;
}
function tickCountdowns(){
  document.querySelectorAll('.countdown').forEach(el=>{ el.textContent = fmtRemaining(el.dataset.lease); });
}
setInterval(tickCountdowns, 1000);
document.getElementById('admin-btn').addEventListener('click', async ()=>{
  try{
    const d = await api('/api/admin/registrations');
    const list = document.getElementById('admin-list');
    list.innerHTML = d.registrations.map(r=>`<div class="card"><b>${r.name||''}</b> · ${r.email||''} · ${r.phone||''}<br><span class="badge ${r.status}">${r.status}</span> <span class="badge plan">${PLAN_LABEL[r.plan||'mensual']||'MENSUAL'}</span> <span class="countdown" data-lease="${r.leaseExpiresAt||''}">…</span><div class="row">
      <button class="ghost" data-id="${r.id}" data-act="approve">Aprobar</button>
      <button class="ghost" data-id="${r.id}" data-act="reject">Rechazar</button>
      <button class="ghost" data-id="${r.id}" data-act="revoke">Desvincular</button>
      <button class="ghost" data-id="${r.id}" data-act="set-plan" data-plan="7d">7 días</button>
      <button class="ghost" data-id="${r.id}" data-act="set-plan" data-plan="15d">15 días</button>
      <button class="ghost" data-id="${r.id}" data-act="set-plan" data-plan="20d">20 días</button>
      <button class="ghost" data-id="${r.id}" data-act="set-plan" data-plan="mensual">1 mes</button>
      <button class="ghost" data-id="${r.id}" data-act="set-plan" data-plan="2m">2 meses</button>
      <button class="ghost" data-id="${r.id}" data-act="set-plan" data-plan="unico">Único</button></div></div>`).join('') || '<p>Sin solicitudes.</p>';
    tickCountdowns();
    list.querySelectorAll('button[data-id]').forEach(b=>b.addEventListener('click', async ()=>{
      await api('/api/admin/registrations/'+encodeURIComponent(b.dataset.id),{method:'PATCH',body:JSON.stringify({action:b.dataset.act, plan:b.dataset.plan||undefined})});
      document.getElementById('admin-btn').click();
    }));
  }catch(err){ document.getElementById('admin-list').textContent = err.message; }
});
</script></body></html>
